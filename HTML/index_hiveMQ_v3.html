<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HomeyFlowTrigger Device Manager</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js"></script>
  <script src="config.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background: linear-gradient(to bottom, #fff8dc, #f7e7a9);
      color: #333;
    }
    header {
      background-color: #ffd700;
      padding: 20px;
      text-align: center;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }
    header h1 {
      margin: 0;
      font-size: 24px;
      color: #333;
    }
    main {
      padding: 20px;
    }
    .wizard-page {
      display: none;
    }
    .wizard-page.active {
      display: block;
    }
    button, input {
      margin: 5px;
      padding: 10px;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 5px;
      background-color: #ffd700;
      color: #333;
      cursor: pointer;
    }
    button:hover {
      background-color: #ffcc00;
    }
    input {
      width: 400px;
    }
    #flowMappings {
      margin-top: 20px;
      border: 1px solid #ccc;
      padding: 10px;
      max-height: 300px;
      overflow-y: auto;
      background-color: #fff8dc;
      border-radius: 5px;
    }
    .flow {
      margin-bottom: 10px;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 5px;
      background-color: #fff;
    }
    .flow input {
      margin: 5px 0;
    }
    footer {
      text-align: center;
      padding: 10px;
      background-color: #ffd700;
      position: fixed;
      bottom: 0;
      width: 100%;
      color: #333;
    }
  </style>
</head>
<body>
  <header>
    <h1>HomeyFlowTrigger Device Manager</h1>
  </header>
  <main>
    <!-- Page 1: Connect to Broker -->
    <div id="page1" class="wizard-page active">
      <h2>1. Connect to HiveMQ Broker</h2>
      <label>Broker URL: <input id="brokerIp" placeholder="wss://your-broker-url:8884/mqtt"></label><br>
      <label>Login: <input id="brokerLogin"></label><br>
      <label>Password: <input id="brokerPassword" type="password"></label><br>
      <button id="connectBroker">Connect</button>
      <span id="broker_status"></span>
    </div>

    <!-- Page 2: Claim Device Name -->
    <div id="page2" class="wizard-page">
      <h2>2. Claim Device Name</h2>
      <label>Default device name: <input id="defaultDevice" placeholder="KwebbelKast_"></label><br>
      <label>Secret: <input id="secret"></label><br>
      <label>New device name: <input id="newDeviceName" placeholder="Jarvis"></label><br>
      <button id="claimDeviceBtn">Claim Device Name</button>
      <span id="claim_status"></span>
      <br>
      <button onclick="showPage(1)">Back</button>
      <button onclick="showPage('2b')">Use Existing Device</button>
    </div>

    <!-- Page 2b: Use Existing Device Name -->
    <div id="page2b" class="wizard-page">
      <h2>2. Use Existing Device Name</h2>
      <label>Device name (prefix): <input id="existingDeviceName" placeholder="e.g. Jarvis, KeukenHulp(Debia), Jetson(Erasmus)"></label><br>
      <button id="useDeviceBtn">Continue</button>
      <span id="existing_status"></span>
      <br>
      <button onclick="showPage(2)">Back</button>
    </div>

    <!-- Page 3: Flow Mappings -->
    <div id="page3" class="wizard-page">
      <h2>3. Flow Mappings</h2>
      <label>Device name (prefix): <input id="deviceName" readonly></label>
      <br>
      <button id="requestFlowMappings" disabled>Request Flow Mappings</button>
      <button id="saveFlowMappings" disabled>Save Flow Mappings</button>
      <button id="requestFlows" disabled>Request Flows</button>
      <div id="flowMappings">
        <div id="flowsContainer"></div>
      </div>
      <br>
      <button onclick="showPage(2)">Back</button>
    </div>
  </main>

  <footer>
    &copy; 2025 Stemcom.nl - All Rights Reserved
  </footer>

  <script>
    let client;
    let flowMappings = {};
    let devicePrefix = "";
    let brokerConnected = false;

    function showPage(nr) {
      document.querySelectorAll('.wizard-page').forEach(div => div.classList.remove('active'));
      document.getElementById('page' + nr).classList.add('active');
    }

    // Helper om topic te genereren met prefix
    function topic(name) {
      if (!devicePrefix) return name;
      return `${devicePrefix}/${name}`;
    }

    // Connect to the HiveMQ broker
    document.getElementById('connectBroker').addEventListener('click', () => {
      const brokerUrl = document.getElementById('brokerIp').value.trim();
      const username = document.getElementById('brokerLogin').value.trim();
      const password = document.getElementById('brokerPassword').value.trim();

      if (!brokerUrl || !username || !password) {
        alert('Please fill in all fields (Broker URL, Login, Password).');
        return;
      }

      client = new Paho.MQTT.Client(brokerUrl, "web-client-" + Math.random());

      client.onConnectionLost = (responseObject) => {
        document.getElementById('broker_status').innerText = '❌ Connection lost: ' + responseObject.errorMessage;
        brokerConnected = false;
      };

      client.onMessageArrived = (message) => {
        const topicName = message.destinationName;
        const payload = message.payloadString;
        console.log("Received topic:", topicName, "payload:", payload);
        // Handle claim responses
        if (topicName.endsWith('/NaamOk')) {
          document.getElementById('claim_status').innerText = "✅ Device name claimed successfully!";
          devicePrefix = document.getElementById('newDeviceName').value.trim();
          document.getElementById('deviceName').value = devicePrefix;
          showPage(3);
          enableFlowButtons(true);
          // Add subscriptions:
          client.subscribe(`${devicePrefix}/send_flow_mappings`);
          client.subscribe(`${devicePrefix}/saved_flow_mappings`);
          client.subscribe(`${devicePrefix}/send_flows`);
        } else if (topicName.endsWith('/NaamError')) {
          document.getElementById('claim_status').innerText = "❌ Error: " + payload;
        } else if (topicName === topic('send_flow_mappings')) {
          flowMappings = JSON.parse(payload);
          displayFlowMappings();
        } else if (topicName === topic('saved_flow_mappings')) {
          const response = JSON.parse(payload);
          alert(response.status === 'success' ? 'Flow mappings saved successfully!' : `Error: ${response.error}`);
        } else if (topicName === topic('send_flows')) {
          displayAvailableFlows(JSON.parse(payload));
        }
      };

      client.connect({
        onSuccess: () => {
          document.getElementById('broker_status').innerText = "✅ Connected!";
          brokerConnected = true;
          showPage(2);
        },
        userName: username,
        password: password,
        useSSL: brokerUrl.startsWith("wss://")
      });
    });

    // Claim device name
    document.getElementById('claimDeviceBtn').addEventListener('click', () => {
      if (!brokerConnected) {
        alert("Connect to the broker first!");
        return;
      }
      const defaultDevice = document.getElementById('defaultDevice').value.trim();
      const secret = document.getElementById('secret').value.trim();
      const newDeviceName = document.getElementById('newDeviceName').value.trim();
      console.log("defaultDevice:", defaultDevice, "secret:", secret, "newDeviceName:", newDeviceName);
      if (!defaultDevice || !secret || !newDeviceName) {
        document.getElementById('claim_status').innerText = "❌ Please fill in all fields.";
        return;
      }

      // Subscribe to response topics
      client.subscribe(`${newDeviceName}/NaamOk`);
      client.subscribe(`${defaultDevice}/NaamError`);
      client.subscribe(`${newDeviceName}/NaamError`);

      // Send claim request
      const payload = JSON.stringify({
        nieuwe_naam: newDeviceName,
        secret: secret,
        timestamp: Date.now()
      });
      const message = new Paho.MQTT.Message(payload);
      message.destinationName = `nieuw/${defaultDevice}`;
      client.send(message);
    });

    // Use existing device name
    document.getElementById('useDeviceBtn').addEventListener('click', () => {
      const deviceName = document.getElementById('existingDeviceName').value.trim();
      if (!deviceName) {
        document.getElementById('existing_status').innerText = "❌ Please enter a device name.";
        return;
      }
      devicePrefix = deviceName;
      document.getElementById('deviceName').value = devicePrefix;
      showPage(3);
      enableFlowButtons(true);
      // Subscribe to topics for this device
      client.subscribe(`${devicePrefix}/send_flow_mappings`);
      client.subscribe(`${devicePrefix}/saved_flow_mappings`);
      client.subscribe(`${devicePrefix}/send_flows`);
    });

    // Enable/disable flow mapping buttons
    function enableFlowButtons(enable) {
      document.getElementById('requestFlowMappings').disabled = !enable;
      document.getElementById('saveFlowMappings').disabled = !enable;
      document.getElementById('requestFlows').disabled = !enable;
    }

    // Request flow mappings
    document.getElementById('requestFlowMappings').addEventListener('click', () => {
      if (!client || !client.isConnected()) return;
      const message = new Paho.MQTT.Message("");
      message.destinationName = topic("request_flow_mappings");
      client.send(message);
    });

    // Save flow mappings
    document.getElementById('saveFlowMappings').addEventListener('click', () => {
      if (!client || !client.isConnected()) return;
      const payload = JSON.stringify(flowMappings);
      const message = new Paho.MQTT.Message(payload);
      message.destinationName = topic("save_flow_mappings");
      client.send(message);
      alert("Message published: save_flow_mappings");
    });

    // Request flows
    document.getElementById('requestFlows').addEventListener('click', () => {
      if (!client || !client.isConnected()) return;
      const searchString = prompt('Enter a search string for flows:');
      const payload = JSON.stringify({ name: searchString });
      const message = new Paho.MQTT.Message(payload);
      message.destinationName = topic("request_flows");
      client.send(message);
    });

    function displayFlowMappings() {
      const container = document.getElementById('flowsContainer');
      container.innerHTML = '';
      for (const [flowName, flowData] of Object.entries(flowMappings)) {
        const flowDiv = document.createElement('div');
        flowDiv.className = 'flow';

        const title = document.createElement('h3');
        title.textContent = `${flowName} (ID: ${flowData.id})`;
        flowDiv.appendChild(title);

        const sentencesContainer = document.createElement('div');
        flowData.sentences.forEach((sentence, index) => {
          const sentenceDiv = document.createElement('div');
          sentenceDiv.style.display = 'flex';
          sentenceDiv.style.alignItems = 'center';

          const input = document.createElement('input');
          input.type = 'text';
          input.value = sentence;
          input.style.flex = '1';
          input.addEventListener('change', (e) => {
            flowData.sentences[index] = e.target.value;
          });

          const deleteButton = document.createElement('button');
          deleteButton.textContent = 'Delete';
          deleteButton.style.marginLeft = '10px';
          deleteButton.addEventListener('click', () => {
            flowData.sentences.splice(index, 1);
            displayFlowMappings();
          });

          sentenceDiv.appendChild(input);
          sentenceDiv.appendChild(deleteButton);
          sentencesContainer.appendChild(sentenceDiv);
        });

        const addSentenceButton = document.createElement('button');
        addSentenceButton.textContent = 'Add Sentence';
        addSentenceButton.addEventListener('click', () => {
          const newSentence = prompt('Enter a new sentence:');
          if (newSentence) {
            flowData.sentences.push(newSentence);
            displayFlowMappings();
          }
        });

        const deleteFlowButton = document.createElement('button');
        deleteFlowButton.textContent = 'Delete Flow';
        deleteFlowButton.addEventListener('click', () => {
          delete flowMappings[flowName];
          displayFlowMappings();
        });

        flowDiv.appendChild(sentencesContainer);
        flowDiv.appendChild(addSentenceButton);
        flowDiv.appendChild(deleteFlowButton);
        container.appendChild(flowDiv);
      }
    }

    function displayAvailableFlows(flows) {
      const container = document.getElementById('flowsContainer');
      container.innerHTML = '';
      for (const [flowName, flowData] of Object.entries(flows)) {
        const flowDiv = document.createElement('div');
        flowDiv.className = 'flow';

        const title = document.createElement('h3');
        title.textContent = `${flowName} (ID: ${flowData.id})`;
        flowDiv.appendChild(title);

        const addButton = document.createElement('button');
        addButton.textContent = 'Add';
        addButton.addEventListener('click', () => {
          flowMappings[flowName] = {
            id: flowData.id,
            sentences: []
          };
          displayFlowMappings();
        });

        flowDiv.appendChild(addButton);
        container.appendChild(flowDiv);
      }
    }
    document.addEventListener('DOMContentLoaded', function() {
      if (window.defaultBrokerConfig) {
        document.getElementById('brokerIp').value = window.defaultBrokerConfig.url;
        document.getElementById('brokerLogin').value = window.defaultBrokerConfig.login;
      } else {
        console.warn('defaultBrokerConfig is niet gedefinieerd!');
      }
    });
  </script>
</body>
</html>
